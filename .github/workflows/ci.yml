name: Operations CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff check --select E4,E7,E9,F ops tests
      - run: pytest -q
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_CONFIG_FILE: /dev/null
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: bash ops/plan.sh
      - run: docker build -t app:ci .
      - name: Container health smoke test
        run: |
          docker run -d --name app -p 127.0.0.1:9000:9000 app:ci
          trap 'docker logs app; docker rm -f app' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health; then
              curl -fsS http://127.0.0.1:9000/metrics | grep http_requests_total
              exit 0
            fi
            sleep 2
          done
          exit 1
